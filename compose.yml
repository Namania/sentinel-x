# Production stack (Raspberry Pi). For development with hot reload, add compose.dev.yml:
#   docker compose -f compose.yml -f compose.dev.yml up --build      (or: make dev)
services:
  db:
    image: postgres:16-alpine
    env_file: ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./.docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: prod
    env_file: ./backend/.env
    environment:
      API_ROOT_PATH: /api
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
