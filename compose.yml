# Production stack (Raspberry Pi). For development with hot reload, add compose.dev.yml:
#   docker compose -f compose.yml -f compose.dev.yml up --build      (or: make dev)
services:
  db:
    image: postgres:16-alpine
    env_file: ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./.docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: prod
    env_file: ./backend/.env
    environment:
      API_ROOT_PATH: /api
      MQTT_HOST: mosquitto
      HOST_THERMAL_PATH: /host/thermal
      HOST_DISK_PATH: /host/rootfs-probe
    volumes:
      # Host health for the dashboard, read-only.
      # /sys/class/thermal only holds symlinks into /sys/devices, which the container does not
      # have: mount the SoC temperature file itself (Docker resolves the link on the host side).
      # statvfs() on any path of the root partition returns that partition's totals, so one
      # harmless file is enough: no need to expose /.
      - /sys/class/thermal/thermal_zone0/temp:/host/thermal/thermal_zone0/temp:ro
      - /etc/os-release:/host/rootfs-probe:ro
      # Reference photos of the face whitelist (VISION_IDENTIFY_FACES), read at API startup.
      - ./backend/data/known_faces:/app/data/known_faces:ro
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    ports:
      - "8080:80"
      # HTTPS, served only once certs/server.crt exists (make tls-init; see README « HTTPS »).
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  # USB webcam plugged into the Pi, served as MJPEG by µStreamer. Point the API at it with
  # CAMERA_STREAM_URL=http://webcam:8080/stream in backend/.env. WEBCAM_DEVICE, WEBCAM_FORMAT,
  # WEBCAM_RESOLUTION and WEBCAM_FPS can be set in the shell or a root .env (defaults below).
  webcam:
    build: ./.docker/webcam
    devices:
      - "${WEBCAM_DEVICE:-/dev/video0}:/dev/video0"
    # GID of the host "video" group (44 on Raspberry Pi OS): rootless Docker checks the device
    # node against the host user's groups, so the user running Docker must be in it too.
    group_add:
      - "44"
    environment:
      # Keep the frame rate steady in dim light (the control's name depends on the kernel; the
      # entrypoint skips the ones this camera does not expose).
      WEBCAM_CONTROLS: ${WEBCAM_CONTROLS:-exposure_auto_priority=0,exposure_dynamic_framerate=0}
      # Optional frame-rate cap (--desired-fps). Empty by default: some Logitech C270 units
      # answer "Inappropriate ioctl" to the rate request and µStreamer then never captures.
      # The browser drops frames it cannot draw, so the camera's native rate is fine.
      WEBCAM_FPS: ${WEBCAM_FPS:-}
    command:
      - --device=/dev/video0
      - --host=0.0.0.0
      - --port=8080
      - --format=${WEBCAM_FORMAT:-MJPEG}
      - --resolution=${WEBCAM_RESOLUTION:-960x720}
      - --tcp-nodelay
      - --workers=2
    restart: unless-stopped

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.22
    ports:
      - "1883:1883"
    volumes:
      - ./.docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

    restart: unless-stopped


volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
