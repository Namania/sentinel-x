# HTTPS (port 8443 on the host). Installed into conf.d by enable-tls.sh only when the certificate
# exists in /etc/nginx/certs (make tls-init on the Pi); without it the stack stays HTTP-only.
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/locations.conf;
}
