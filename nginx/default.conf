map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP (port 8080 on the host). The SSH log agent talks to it on 127.0.0.1; it stays open
# even when HTTPS is enabled (tls.conf, added at start when certs/server.crt exists).
server {
    listen 80;

    include /etc/nginx/snippets/locations.conf;
}
