[project]
name = "sentinel-backend"
version = "0.1.0"
description = "sentinel-x backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.8",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "aiomqtt>=2.5.1",
]

[project.optional-dependencies]
# Person detection (YOLOv8n, exported to NCNN for the Pi) on the camera stream, i.e. "is anyone
# there?" - no identification. Installed when VISION_ENABLED=true is used.
# Pulls in PyTorch (ultralytics' backend): expect a sizeable image on the Pi, but no TensorFlow.
vision = [
    "ultralytics>=8.3",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "ncnn>=1.0.20240410",
]
# Adds face whitelist matching (DeepFace/ArcFace): "who is it?" on top of "is anyone there?".
# Installed when VISION_IDENTIFY_FACES=true is also used.
#
# Heavy on top of `vision`: deepface pulls in TensorFlow (it has no lighter backend on PyPI
# despite what its README suggests) - 500MB+ extra, with no GPU to make use of on the Pi. Keep
# this off unless the known-faces whitelist is actually needed.
vision-identify = [
    "sentinel-backend[vision]",
    "deepface>=0.0.93",
]

[project.scripts]
create-user = "app.presentation.cli:create_user_command"
simulate-sensors = "app.presentation.simulate:simulate_sensors_command"
yolo-export-ncnn = "app.infrastructure.vision.yolo_export_ncnn:export_ncnn_command"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "websockets>=13",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
