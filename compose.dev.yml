# Development overrides: hot reload for the API (uvicorn --reload) and the front (Vite HMR).
# Usage: docker compose -f compose.yml -f compose.dev.yml up --build   (or: make dev)
services:
  api:
    build:
      target: dev
    environment:
      # File events through Docker bind mounts are not reliable: poll instead of waiting for them.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # The Vite proxy talks to the api container instead of a local uvicorn.
      API_PROXY_TARGET: http://api:8000
      # File events through Docker bind mounts are not reliable: poll by default.
      # Set to "false" to go back to native events.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    # !override replaces the production mapping (8080:80) instead of merging with it.
    ports: !override
      - "8080:5173"

