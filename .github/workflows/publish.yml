# Builds the three images of the stack for the Raspberry Pi (linux/arm64) and pushes them to
# Docker Hub on every push to main. The Pi then only pulls (make deploy): no build on the SD card.
#
# Repository settings → Secrets and variables → Actions:
#   secrets  DOCKERHUB_USERNAME  the Docker Hub account
#            DOCKERHUB_TOKEN     an access token of that account (Read & Write)
#   variable DOCKERHUB_NAMESPACE (optional) the namespace the images live in; defaults to the username
# Images: <namespace>/sentinel-x-api, <namespace>/sentinel-x-web, <namespace>/sentinel-x-webcam,
# tagged `latest`, `main` and `sha-<commit>`.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
            target: prod
          - name: web
            context: .
            file: frontend/Dockerfile
            target: prod
          - name: webcam
            context: .docker/webcam
            file: .docker/webcam/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/sentinel-x-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
