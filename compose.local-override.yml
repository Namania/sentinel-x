# Local-only override, not part of the repo's compose files: this machine already has a
# Postgres instance bound to 127.0.0.1:5432, which collides with compose.yml's db port mapping.
# The api container talks to db over the internal Docker network regardless, so the published
# port is only needed for external debugging and can be dropped here without affecting the stack.
services:
  db:
    ports: !override []
  api:
    build:
      args:
        VISION: "true"
