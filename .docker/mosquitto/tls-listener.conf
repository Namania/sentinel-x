# MQTTS for the devices on the LAN. Same certificate as the dashboard (make tls-init); the ESP
# embeds certs/ca.crt. Enabled by entrypoint.sh only when the certificate is mounted.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
