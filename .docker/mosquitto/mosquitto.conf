# Mosquitto (eclipse-mosquitto 2.x), started by entrypoint.sh (see compose.yml).
#
# 1883: the API (Docker network) and, while the firmwares migrate, the LAN. No anonymous client:
# every account is created with `make mqtt-user`; a device's account name is its id (its topic).
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
# A private copy (600) of config/acl, made by entrypoint.sh: mosquitto wants it unreadable by others.
acl_file /mosquitto/acl

# 8883 (MQTTS for the ESPs): tls-listener.conf is copied here at start when certs/server.crt exists.
include_dir /mosquitto/conf.d

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Rootless Docker: "root" inside the container is the unprivileged sentinel-x user of the host.
# Staying root lets the broker read the private key (mode 600) mounted from certs/.
user root
